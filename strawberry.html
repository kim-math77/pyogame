<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>딸기 게임</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Malgun Gothic', sans-serif;
        background: linear-gradient(-45deg, #ffe6ef, #fff5da, #d9f6ee, #e8f0ff);
        background-size: 400% 400%;
        animation: gradientBG 16s ease infinite;
        color: #4f4a5a;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 6px 10px;
    }
    @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    .container {
        width: min(980px, 100%);
        background: rgba(255,255,255,0.88);
        border: 1px solid rgba(255,255,255,0.85);
        border-radius: 26px;
        padding: 8px 12px 12px;
        box-shadow: 0 16px 40px rgba(113, 103, 132, 0.18);
        backdrop-filter: blur(5px);
        position: relative;
    }
    h1 {
        margin: 0 0 4px;
        text-align: center;
        font-size: 26px;
        color: #ce4971;
        text-shadow: 0 1px 0 rgba(255,255,255,.9);
    }
    .top-buttons {
        display: flex;
        justify-content: flex-start;
        margin-bottom: 2px;
    }
    .back-btn {
        display: inline-block;
        background: linear-gradient(180deg, #98b4c8 0%, #7d9caf 100%);
        color: white;
        text-decoration: none;
        font-weight: bold;
        border-radius: 12px;
        padding: 7px 14px;
        box-shadow: 0 6px 14px rgba(75, 98, 118, 0.18);
    }
    .game-wrap {
        position: relative;
        width: 100%;
        display: flex;
        justify-content: center;
    }
    #gameCanvas {
        width: min(940px, 100%);
        max-width: 940px;
        aspect-ratio: 940 / 660;
        border-radius: 20px;
        border: 4px solid #f0bfd0;
        background: linear-gradient(180deg, #fff9fc 0%, #fffef7 56%, #f4fff8 100%);
        box-shadow: inset 0 0 24px rgba(255,255,255,.9), 0 8px 20px rgba(112, 129, 148, 0.16);
        touch-action: none;
    }
    .overlay {
        position: absolute;
        inset: 0;
        border-radius: 20px;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(255, 250, 252, 0.86);
        z-index: 20;
        padding: 24px;
    }
    .panel {
        width: min(560px, 92%);
        background: linear-gradient(180deg, rgba(255,252,244,0.98) 0%, rgba(255,241,246,0.98) 100%);
        border: 1px solid #f0c4d2;
        border-radius: 24px;
        box-shadow: 0 12px 28px rgba(122, 101, 123, 0.16);
        padding: 24px 24px 20px;
        text-align: center;
        color: #503d4e;
    }
    .panel h2 {
        margin: 4px 0 14px;
        color: #cc476f;
        font-size: 32px;
    }
    .guide {
        text-align: left;
        line-height: 1.82;
        background: rgba(255,255,255,0.8);
        border: 1px solid #f0d6de;
        border-radius: 18px;
        padding: 14px 18px;
        font-size: 16px;
        box-shadow: inset 0 0 10px rgba(255,255,255,0.85);
    }
    .guide strong { color: #bf3f66; }
    .hint-box {
        margin-top: 12px;
        background: linear-gradient(180deg, #eefaf6 0%, #f7fffb 100%);
        border: 1px solid #cbe6db;
        border-radius: 16px;
        padding: 10px 14px;
        text-align: left;
        line-height: 1.75;
        font-size: 15px;
    }
    .start-btn, .retry-btn {
        margin-top: 16px;
        border: none;
        border-radius: 14px;
        background: linear-gradient(180deg, #f1658c 0%, #d94972 100%);
        color: white;
        font-size: 22px;
        font-weight: bold;
        padding: 14px 36px;
        cursor: pointer;
        box-shadow: 0 8px 18px rgba(213, 73, 114, 0.26);
    }
    .result-score {
        font-size: 22px;
        margin: 10px 0 6px;
        color: #5a4258;
        font-weight: bold;
    }
    .best-line {
        margin-top: 8px;
        color: #7c5a6f;
        font-weight: bold;
    }
    .small-note {
        margin-top: 10px;
        font-size: 13px;
        color: #7d7683;
    }
    .mode-grid {
        display:grid;
        grid-template-columns: repeat(3, minmax(0,1fr));
        gap:16px;
        margin-top:14px;
    }
    .mode-choice {
        border:1px solid #efbfd0;
        border-radius:20px;
        padding:20px 16px;
        cursor:pointer;
        background:linear-gradient(180deg,#fff8fb 0%,#ffe9f1 100%);
        box-shadow:0 8px 18px rgba(165,102,127,.14);
        transition:.2s;
        color:#5a4454;
        font-family:inherit;
    }
    .mode-choice:hover { transform:translateY(-4px); box-shadow:0 12px 22px rgba(165,102,127,.2); }
    .mode-choice.median { background:linear-gradient(180deg,#f5fbff 0%,#e3f2ff 100%); border-color:#bdd8ec; }
    .mode-choice.mode { background:linear-gradient(180deg,#f6fff8 0%,#e3f5e8 100%); border-color:#b9d9c1; }
    .mode-choice .emoji { font-size:42px; display:block; margin-bottom:8px; }
    .mode-choice strong { display:block; font-size:22px; color:#c74870; margin-bottom:6px; }
    .mode-choice.median strong { color:#4e7fa8; }
    .mode-choice.mode strong { color:#4f8b63; }
    .mode-choice span { font-size:14px; line-height:1.55; }
    .menu-back-btn {
        margin-top:12px; border:none; border-radius:12px; padding:10px 18px; cursor:pointer;
        font-weight:bold; background:#95adbd; color:white; font-family:inherit;
    }
    @media (max-width: 650px) { .mode-grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
    <div class="container">
        <div class="top-buttons">
            <a href="stat.html" class="back-btn">⬅ 뒤로 가기</a>
        </div>
        <h1>🍓 딸기 게임</h1>
        <div class="game-wrap">
            <canvas id="gameCanvas" width="940" height="660"></canvas>

            <div class="overlay" id="modeOverlay" style="display:flex;">
                <div class="panel">
                    <h2>🍓 딸기 게임</h2>
                    <div style="font-size:17px; font-weight:bold; color:#6c5867;">도전할 게임을 선택하세요!</div>
                    <div class="mode-grid">
                        <button class="mode-choice" id="btnAverageMode">
                            <span class="emoji">🍓</span>
                            <strong>평균 딸기게임</strong>
                            <span>2~3개의 딸기를 이어<br>평균이 5가 되면 제거!</span>
                        </button>
                        <button class="mode-choice median" id="btnMedianMode">
                            <span class="emoji">🍓</span>
                            <strong>중앙값 딸기게임</strong>
                            <span>3~5개의 딸기를 이어<br>중앙값이 5가 되면 제거!</span>
                        </button>
                        <button class="mode-choice mode" id="btnModeMode">
                            <span class="emoji">🍓</span>
                            <strong>최빈값 딸기게임</strong>
                            <span>3~5개의 딸기를 이어<br>최빈값이 5가 되면 제거!</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="overlay" id="startOverlay">
                <div class="panel">
                    <h2 id="gameModeTitle">🍓 평균 딸기게임</h2>
                    <div class="guide" id="gameGuide"></div>
                    <div class="hint-box" id="hintBox"></div>
                    <div class="best-line" id="bestStartText">최고 기록: 0점</div>
                    <button class="start-btn" id="btnStartGame">▶ 게임 시작</button>
                    <br><button class="menu-back-btn" id="btnBackToModes">← 게임 선택</button>
                </div>
            </div>

            <div class="overlay" id="resultOverlay">
                <div class="panel">
                    <h2>⏰ 시간 종료!</h2>
                    <div class="result-score" id="finalScoreText">이번 점수: 0점</div>
                    <div class="best-line" id="bestResultText">최고 기록: 0점</div>
                    <button class="retry-btn" id="btnRetryGame">다시 도전하기</button>
                    <button class="menu-back-btn" id="btnResultBackToModes">돌아가기</button>
                    <div class="small-note">최고 기록은 이 기기에서 자동으로 저장됩니다.</div>
                </div>
            </div>
        </div>
    </div>

<script>
(() => {
    const PASSWORD = '1111';
    const AUTH_KEY = 'strawberryGameUnlocked';
    if (sessionStorage.getItem(AUTH_KEY) !== 'true') {
        const pwd = prompt('딸기 게임 비밀번호를 입력하세요 🔒');
        if (pwd === PASSWORD) {
            sessionStorage.setItem(AUTH_KEY, 'true');
        } else {
            alert('비밀번호가 틀렸습니다! ❌');
            location.href = 'stat.html';
            return;
        }
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const modeOverlay = document.getElementById('modeOverlay');
    const startOverlay = document.getElementById('startOverlay');
    const resultOverlay = document.getElementById('resultOverlay');
    const bestStartText = document.getElementById('bestStartText');
    const bestResultText = document.getElementById('bestResultText');
    const finalScoreText = document.getElementById('finalScoreText');
    const btnStartGame = document.getElementById('btnStartGame');
    const btnRetryGame = document.getElementById('btnRetryGame');
    const btnAverageMode = document.getElementById('btnAverageMode');
    const btnMedianMode = document.getElementById('btnMedianMode');
    const btnModeMode = document.getElementById('btnModeMode');
    const btnBackToModes = document.getElementById('btnBackToModes');
    const btnResultBackToModes = document.getElementById('btnResultBackToModes');
    const gameModeTitle = document.getElementById('gameModeTitle');
    const gameGuide = document.getElementById('gameGuide');
    const hintBox = document.getElementById('hintBox');

    const ROWS = 10;
    const COLS = 10;
    const CELL = 53;
    const GAP = 7;
    const BOARD_X = 28;
    const BOARD_Y = 34;
    const GAME_DURATION = 90 * 1000;
    let currentMode = 'average';
    let BEST_KEY = 'strawberryAverageBestScore';
    let SCORE_POP_KEY = 'strawberryAverageLastScore';

    let board = [];
    let selection = [];
    let dragging = false;
    let gameState = 'start';
    let score = 0;
    let bestScore = Number(localStorage.getItem(BEST_KEY) || 0);
    let startTime = 0;
    let endTime = 0;
    let timeLeft = GAME_DURATION;
    let rafId = null;
    let particles = [];
    let flashText = '';
    let flashUntil = 0;
    let boardLocked = false;
    let lastNoMoveCheck = 0;
    let reshufflePending = false;

    updateBestTexts();
    renderFrame();
    rafId = requestAnimationFrame(loop);

    btnAverageMode.addEventListener('click', () => chooseMode('average'));
    btnMedianMode.addEventListener('click', () => chooseMode('median'));
    btnModeMode.addEventListener('click', () => chooseMode('mode'));
    btnBackToModes.addEventListener('click', showModeMenu);
    btnResultBackToModes.addEventListener('click', showModeMenu);
    btnStartGame.addEventListener('click', startGame);
    btnRetryGame.addEventListener('click', () => {
        resultOverlay.style.display = 'none';
        startGame();
    });

    canvas.addEventListener('pointerdown', handlePointerDown);
    canvas.addEventListener('pointermove', handlePointerMove);
    window.addEventListener('pointerup', handlePointerUp);
    window.addEventListener('pointercancel', handlePointerUp);

    function chooseMode(mode) {
        currentMode = mode;
        if (mode === 'average') {
            BEST_KEY = 'strawberryAverageBestScore';
            SCORE_POP_KEY = 'strawberryAverageLastScore';
        } else if (mode === 'median') {
            BEST_KEY = 'strawberryMedianBestScore';
            SCORE_POP_KEY = 'strawberryMedianLastScore';
        } else {
            BEST_KEY = 'strawberryModeBestScore';
            SCORE_POP_KEY = 'strawberryModeLastScore';
        }
        bestScore = Number(localStorage.getItem(BEST_KEY) || 0);
        updateBestTexts();

        if (mode === 'average') {
            gameModeTitle.textContent = '🍓 평균 딸기게임';
            gameGuide.innerHTML = `<strong>게임 방법</strong><br>
                ① 숫자를 보고 <strong>서로 이웃한 딸기 2~3개</strong>를 손가락으로 드래그해 선택하세요.<br>
                ② 선택한 숫자들의 <strong>평균이 5</strong>이면 딸기가 사라집니다.<br>
                ③ 사라진 딸기 개수만큼 점수를 얻습니다.<br>
                ④ 제한 시간 <strong>90초</strong> 안에 최고 점수에 도전하세요!<br>
                ⑤ 가능한 조합이 모두 사라지면 <strong>새 딸기판</strong>이 자동으로 준비됩니다.`;
            hintBox.innerHTML = `<strong>빠른 힌트</strong><br>2개 → 합이 10<br>3개 → 합이 15`;
        } else if (mode === 'median') {
            gameModeTitle.textContent = '🍓 중앙값 딸기게임';
            gameGuide.innerHTML = `<strong>게임 방법</strong><br>
                ① 숫자를 보고 <strong>서로 이웃한 딸기 3~5개</strong>를 손가락으로 드래그해 선택하세요.<br>
                ② 선택한 수를 크기순으로 놓았을 때 <strong>중앙값이 5</strong>이면 딸기가 사라집니다.<br>
                ③ 사라진 딸기 개수만큼 점수를 얻습니다.<br>
                ④ 제한 시간 <strong>90초</strong> 안에 최고 점수에 도전하세요!<br>
                ⑤ 가능한 조합이 모두 사라지면 <strong>새 딸기판</strong>이 자동으로 준비됩니다.`;
            hintBox.innerHTML = `<strong>중앙값 힌트</strong><br>3개·5개 → 크기순으로 놓았을 때 가운데 수가 5<br>4개 → 가운데 두 수의 평균이 5<br>예) 2,5,8 / 1,4,6,9 / 1,3,5,7,9`;
        } else {
            gameModeTitle.textContent = '🍓 최빈값 딸기게임';
            gameGuide.innerHTML = `<strong>게임 방법</strong><br>
                ① 숫자를 보고 <strong>서로 이웃한 딸기 3~5개</strong>를 손가락으로 드래그해 선택하세요.<br>
                ② 선택한 수 중 <strong>5가 유일한 최빈값</strong>이면 딸기가 사라집니다.<br>
                ③ 사라진 딸기 개수만큼 점수를 얻습니다.<br>
                ④ 제한 시간 <strong>90초</strong> 안에 최고 점수에 도전하세요!<br>
                ⑤ 가능한 조합이 모두 사라지면 <strong>새 딸기판</strong>이 자동으로 준비됩니다.`;
            hintBox.innerHTML = `<strong>최빈값 힌트</strong><br>5가 다른 어떤 수보다 더 많이 나와야 합니다.<br>예) 5,5,2 → 성공 / 5,5,2,2 → 공동 최빈값이라 실패`;
        }
        modeOverlay.style.display = 'none';
        resultOverlay.style.display = 'none';
        startOverlay.style.display = 'flex';
        gameState = 'start';
        board = [];
        selection = [];
    }

    function showModeMenu() {
        gameState = 'start';
        board = [];
        selection = [];
        dragging = false;
        modeOverlay.style.display = 'none';
        startOverlay.style.display = 'none';
        resultOverlay.style.display = 'none';
        modeOverlay.style.display = 'flex';
    }

    function getMinSelection() {
        return currentMode === 'average' ? 2 : 3;
    }

    function getMaxSelection() {
        return currentMode === 'average' ? 3 : 5;
    }

    function isValidSelectionValues(values) {
        const min = getMinSelection();
        const max = getMaxSelection();
        if (values.length < min || values.length > max) return false;

        if (currentMode === 'average') {
            const sum = values.reduce((a,b) => a+b, 0);
            return sum === values.length * 5;
        }

        if (currentMode === 'median') {
            const sorted = [...values].sort((a,b) => a-b);
            const n = sorted.length;
            if (n % 2 === 1) return sorted[Math.floor(n/2)] === 5;
            return sorted[n/2 - 1] + sorted[n/2] === 10;
        }

        const counts = new Map();
        for (const v of values) counts.set(v, (counts.get(v) || 0) + 1);
        const fiveCount = counts.get(5) || 0;
        if (fiveCount === 0) return false;
        for (const [value, count] of counts.entries()) {
            if (value !== 5 && count >= fiveCount) return false;
        }
        return true;
    }

    function updateBestTexts() {
        bestStartText.textContent = `최고 기록: ${bestScore}점`;
        bestResultText.textContent = `최고 기록: ${bestScore}점`;
    }

    function startGame() {
        score = 0;
        selection = [];
        dragging = false;
        particles = [];
        board = generatePlayableBoard();
        gameState = 'playing';
        startOverlay.style.display = 'none';
        resultOverlay.style.display = 'none';
        startTime = performance.now();
        endTime = startTime + GAME_DURATION;
        timeLeft = GAME_DURATION;
        flashText = '시작!';
        flashUntil = performance.now() + 900;
        boardLocked = false;
        lastNoMoveCheck = 0;
        reshufflePending = false;
        renderFrame();
    }

    function endGame() {
        if (gameState !== 'playing') return;
        gameState = 'ended';
        dragging = false;
        selection = [];
        timeLeft = 0;
        if (score > bestScore) {
            bestScore = score;
            localStorage.setItem(BEST_KEY, String(bestScore));
            updateBestTexts();
        }
        localStorage.setItem(SCORE_POP_KEY, String(score));
        finalScoreText.textContent = `이번 점수: ${score}점`;
        resultOverlay.style.display = 'flex';
        renderFrame();
    }

    function loop(ts) {
        updateParticles(ts);
        if (gameState === 'playing') {
            timeLeft = Math.max(0, endTime - ts);
            if (timeLeft <= 0) {
                endGame();
            } else if (!boardLocked && !dragging && !reshufflePending && ts - lastNoMoveCheck >= 700) {
                lastNoMoveCheck = ts;
                if (!hasAnyValidMove(board)) {
                    scheduleNewBoard();
                }
            }
        }
        renderFrame();
        rafId = requestAnimationFrame(loop);
    }

    function generatePlayableBoard() {
        // 세 모드 모두 시작부터 가능한 조합이 넉넉한 판만 채택합니다.
        // evaluateBoard는 같은 조합을 진행 방향에 따라 여러 경로로 셀 수 있으므로
        // 아래 기준은 절대적인 '정답 개수'가 아니라 보드의 조합 밀도를 보장하는 내부 기준입니다.
        const targetCount = currentMode === 'average' ? 100 : (currentMode === 'median' ? 1400 : 900);
        const attempts = currentMode === 'average' ? 260 : 140;
        let bestCandidate = null;
        let bestCount = -1;

        for (let attempt = 0; attempt < attempts; attempt++) {
            const boardTry = Array.from({ length: ROWS }, () =>
                Array.from({ length: COLS }, () => randomBoardValue())
            );

            // 목표치에 도달하는 순간 더 셀 필요가 없으므로 targetCount까지만 검사합니다.
            const count = evaluateBoard(boardTry, targetCount);
            if (count >= targetCount) return boardTry;

            if (count > bestCount) {
                bestCount = count;
                bestCandidate = boardTry;
            }
        }

        // 아주 드물게 목표치를 못 넘겨도, 시도한 판 중 조합이 가장 많은 판을 사용합니다.
        if (bestCandidate) return bestCandidate;

        const fallbackBoard = Array.from({ length: ROWS }, () =>
            Array.from({ length: COLS }, () => randomBoardValue())
        );
        return fallbackBoard;
    }

    function evaluateBoard(targetBoard, limit = Infinity) {
        let count = 0;
        const visited = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (targetBoard[r][c] == null) continue;
                visited[r][c] = true;
                dfsCount(r, c, 1, targetBoard[r][c], visited, targetBoard, [targetBoard[r][c]]);
                visited[r][c] = false;
                if (count >= limit) return count;
            }
        }
        return count;

        function dfsCount(r, c, length, sum, visited, boardRef, pathValues) {
            if (length >= 2 && isValidSelectionValues(pathValues)) {
                count++;
                if (count >= limit) return;
            }
            if (length === getMaxSelection() || count >= limit) return;
            const neighbors = getLogicalNeighbors(boardRef, r, c);
            for (const [nr, nc] of neighbors) {
                if (visited[nr][nc]) continue;
                visited[nr][nc] = true;
                dfsCount(nr, nc, length + 1, sum + boardRef[nr][nc], visited, boardRef, [...pathValues, boardRef[nr][nc]]);
                visited[nr][nc] = false;
                if (count >= limit) return;
            }
        }
    }

    function hasAnyValidMove(targetBoard) {
        const visited = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (targetBoard[r][c] == null) continue;
                visited[r][c] = true;
                if (dfsFind(r, c, 1, targetBoard[r][c], [targetBoard[r][c]])) {
                    visited[r][c] = false;
                    return true;
                }
                visited[r][c] = false;
            }
        }
        return false;

        function dfsFind(r, c, length, sum, pathValues) {
            if (length >= 2 && isValidSelectionValues(pathValues)) return true;
            if (length === getMaxSelection()) return false;
            const neighbors = getLogicalNeighbors(targetBoard, r, c);
            for (const [nr, nc] of neighbors) {
                if (visited[nr][nc]) continue;
                visited[nr][nc] = true;
                if (dfsFind(nr, nc, length + 1, sum + targetBoard[nr][nc], [...pathValues, targetBoard[nr][nc]])) {
                    visited[nr][nc] = false;
                    return true;
                }
                visited[nr][nc] = false;
            }
            return false;
        }
    }

    function getLogicalNeighbors(boardRef, row, col) {
        const result = [];
        const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
        for (const [dr, dc] of dirs) {
            let nr = row + dr;
            let nc = col + dc;
            while (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                if (boardRef[nr][nc] != null) {
                    result.push([nr, nc]);
                    break;
                }
                nr += dr;
                nc += dc;
            }
        }
        return result;
    }

    function handlePointerDown(e) {
        if (gameState !== 'playing' || boardLocked) return;
        const cell = getCellFromEvent(e);
        if (!cell) return;
        const { row, col } = cell;
        if (board[row][col] == null) return;
        dragging = true;
        selection = [{ row, col }];
        canvas.setPointerCapture?.(e.pointerId);
    }

    function handlePointerMove(e) {
        if (!dragging || gameState !== 'playing' || boardLocked) return;
        const cell = getCellFromEvent(e);
        if (!cell) return;
        const { row, col } = cell;
        if (board[row][col] == null) return;
        const last = selection[selection.length - 1];
        if (last && last.row === row && last.col === col) return;

        if (selection.length >= 2) {
            const prev = selection[selection.length - 2];
            if (prev.row === row && prev.col === col) {
                selection.pop();
                return;
            }
        }

        if (selection.some(pos => pos.row === row && pos.col === col)) return;
        if (selection.length >= getMaxSelection()) return;
        if (isLogicalNeighbor(last, { row, col })) {
            selection.push({ row, col });
        }
    }

    function handlePointerUp() {
        if (!dragging) return;
        dragging = false;
        if (gameState !== 'playing' || boardLocked) {
            selection = [];
            return;
        }
        if (selection.length >= getMinSelection() && selection.length <= getMaxSelection()) {
            const values = selection.map(pos => board[pos.row][pos.col]);
            if (isValidSelectionValues(values)) {
                applySuccess(selection);
            }
        }
        selection = [];
    }

    function isLogicalNeighbor(a, b) {
        if (!a || !b) return false;
        const neighbors = getLogicalNeighbors(board, a.row, a.col);
        return neighbors.some(([nr, nc]) => nr === b.row && nc === b.col);
    }

    function applySuccess(selectedCells) {
        boardLocked = true;
        const snapshot = selectedCells.map(pos => ({ row: pos.row, col: pos.col, value: board[pos.row][pos.col] }));
        for (const cell of snapshot) {
            spawnPopParticles(cell);
            board[cell.row][cell.col] = null;
        }
        score += snapshot.length;
        if (score > bestScore) {
            bestScore = score;
            localStorage.setItem(BEST_KEY, String(bestScore));
            updateBestTexts();
        }
        setTimeout(() => {
            if (gameState !== 'playing') {
                boardLocked = false;
                return;
            }
            const noFiveLeftInMedian =
                currentMode === 'median' &&
                !board.some(row => row.some(value => value === 5));

            if (noFiveLeftInMedian) {
                scheduleNewBoard('5가 모두 사라졌어요! 새 딸기판으로 바꿉니다 🍓');
            } else if (!hasAnyValidMove(board)) {
                scheduleNewBoard();
            } else {
                boardLocked = false;
            }
        }, 220);
    }

    function scheduleNewBoard(message = '조합이 없어요! 새 딸기판으로 바꿉니다 🍓') {
        if (reshufflePending || gameState !== 'playing') return;
        reshufflePending = true;
        boardLocked = true;
        dragging = false;
        selection = [];
        flashText = message;
        flashUntil = performance.now() + 1200;

        setTimeout(() => {
            if (gameState !== 'playing') {
                boardLocked = false;
                reshufflePending = false;
                return;
            }
            board = generatePlayableBoard();
            boardLocked = false;
            reshufflePending = false;
            lastNoMoveCheck = performance.now();
        }, 850);
    }

    function spawnPopParticles(cell) {
        const center = getCellCenter(cell.row, cell.col);
        for (let i = 0; i < 10; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 1.2 + Math.random() * 2.4;
            particles.push({
                x: center.x,
                y: center.y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 0.8,
                life: 0.6 + Math.random() * 0.18,
                maxLife: 0.6 + Math.random() * 0.18,
                size: 4 + Math.random() * 5,
                color: Math.random() > 0.35 ? '#ff6b90' : '#ffd56f'
            });
        }
    }

    function updateParticles(ts) {
        const now = performance.now();
        particles = particles.filter(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.04;
            p.life -= 1 / 60;
            return p.life > 0;
        });
        if (flashText && now > flashUntil) flashText = '';
    }

    function renderFrame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBoardBackground();
        drawHud();
        drawCells();
        drawSelectionLine();
        drawParticles();
        drawFlashMessage();
        if (gameState !== 'playing') {
            drawIdleHint();
        }
    }

    function drawBoardBackground() {
        ctx.save();
        const boardW = COLS * CELL + (COLS - 1) * GAP;
        const boardH = ROWS * CELL + (ROWS - 1) * GAP;
        roundRect(ctx, BOARD_X - 14, BOARD_Y - 14, boardW + 28, boardH + 28, 24);
        const bg = ctx.createLinearGradient(0, BOARD_Y, 0, BOARD_Y + boardH);
        bg.addColorStop(0, 'rgba(255, 247, 251, 0.95)');
        bg.addColorStop(1, 'rgba(241, 255, 247, 0.95)');
        ctx.fillStyle = bg;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#e9c5d3';
        ctx.stroke();
        ctx.restore();
    }

    function drawHud() {
        const nowScore = score;
        const seconds = Math.ceil(timeLeft / 1000);
        const hudX = 666;
        const hudW = 238;

        drawHudPill(hudX, 70, hudW, 116, '#fff4f8', '#f0c6d4');
        ctx.fillStyle = '#86596f';
        ctx.font = 'bold 20px Malgun Gothic';
        ctx.textAlign = 'center';
        ctx.fillText('최고 기록', hudX + hudW / 2, 105);
        ctx.font = 'bold 34px Malgun Gothic';
        ctx.fillStyle = '#c54870';
        ctx.fillText(`${bestScore}점`, hudX + hudW / 2, 151);

        drawHudPill(hudX, 218, hudW, 116, '#fff7eb', '#edd8a8');
        ctx.fillStyle = '#7c5c3f';
        ctx.font = 'bold 20px Malgun Gothic';
        ctx.fillText('점수', hudX + hudW / 2, 253);
        ctx.fillStyle = '#d45462';
        ctx.font = 'bold 38px Malgun Gothic';
        ctx.fillText(String(nowScore), hudX + hudW / 2, 302);

        drawHudPill(hudX, 366, hudW, 116, '#eef8ff', '#b9d9f0');
        ctx.fillStyle = '#56718a';
        ctx.font = 'bold 20px Malgun Gothic';
        ctx.fillText('남은 시간', hudX + hudW / 2, 401);
        ctx.fillStyle = seconds <= 10 ? '#df3a57' : '#3178b8';
        ctx.font = 'bold 38px Malgun Gothic';
        ctx.fillText(`${seconds}초`, hudX + hudW / 2, 450);

        ctx.fillStyle = '#9a7b88';
        ctx.font = 'bold 17px Malgun Gothic';
        ctx.fillText(currentMode === 'average' ? '평균 = 5' : (currentMode === 'median' ? '중앙값 = 5' : '최빈값 = 5'), hudX + hudW / 2, 535);
    }

    function drawHudPill(x, y, w, h, fill, stroke) {
        ctx.save();
        roundRect(ctx, x, y, w, h, 22);
        ctx.fillStyle = fill;
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = stroke;
        ctx.stroke();
        ctx.restore();
    }

    function drawCells() {
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const x = BOARD_X + c * (CELL + GAP);
                const y = BOARD_Y + r * (CELL + GAP);

                roundRect(ctx, x, y, CELL, CELL, 16);
                ctx.fillStyle = 'rgba(255,255,255,0.55)';
                ctx.fill();
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = 'rgba(237, 211, 222, 0.85)';
                ctx.stroke();

                if (board[r] && board[r][c] != null) {
                    const selected = selection.some(pos => pos.row === r && pos.col === c);
                    drawStrawberry(x + CELL / 2, y + CELL / 2 + 2, 19, board[r][c], selected);
                }
            }
        }
    }

    function drawStrawberry(cx, cy, radius, value, selected) {
        ctx.save();
        if (selected) {
            ctx.shadowColor = 'rgba(255, 214, 64, 0.9)';
            ctx.shadowBlur = 18;
        }

        // leaf
        ctx.beginPath();
        ctx.moveTo(cx - 12, cy - 12);
        ctx.quadraticCurveTo(cx - 5, cy - 23, cx, cy - 15);
        ctx.quadraticCurveTo(cx + 5, cy - 23, cx + 12, cy - 12);
        ctx.quadraticCurveTo(cx + 1, cy - 12, cx, cy - 7);
        ctx.quadraticCurveTo(cx - 1, cy - 12, cx - 12, cy - 12);
        ctx.fillStyle = '#77ba4b';
        ctx.fill();

        // strawberry body
        const grad = ctx.createLinearGradient(cx, cy - 22, cx, cy + 24);
        grad.addColorStop(0, '#ff97ad');
        grad.addColorStop(0.45, '#f75b7d');
        grad.addColorStop(1, '#d53e62');
        ctx.beginPath();
        ctx.moveTo(cx, cy - 19);
        ctx.bezierCurveTo(cx + 18, cy - 22, cx + 23, cy - 2, cx + 10, cy + 18);
        ctx.bezierCurveTo(cx + 6, cy + 24, cx + 1, cy + 26, cx, cy + 27);
        ctx.bezierCurveTo(cx - 1, cy + 26, cx - 6, cy + 24, cx - 10, cy + 18);
        ctx.bezierCurveTo(cx - 23, cy - 2, cx - 18, cy - 22, cx, cy - 19);
        ctx.closePath();
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.lineWidth = selected ? 3.5 : 2.2;
        ctx.strokeStyle = selected ? '#ffd64f' : '#c43759';
        ctx.stroke();

        ctx.shadowBlur = 0;

        // seeds
        ctx.fillStyle = 'rgba(255, 232, 164, 0.95)';
        const seeds = [[-7,-4], [0,-6], [7,-3], [-9,5], [-2,3], [5,4], [0,11]];
        seeds.forEach(([sx, sy]) => {
            ctx.beginPath();
            ctx.ellipse(cx + sx, cy + sy, 1.7, 2.3, 0.2, 0, Math.PI * 2);
            ctx.fill();
        });

        // number
        ctx.fillStyle = '#fffdf8';
        ctx.font = 'bold 20px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.strokeStyle = 'rgba(142, 32, 58, 0.55)';
        ctx.lineWidth = 4;
        ctx.strokeText(String(value), cx, cy + 3);
        ctx.fillText(String(value), cx, cy + 3);

        ctx.restore();
    }

    function drawSelectionLine() {
        if (!selection.length) return;
        ctx.save();
        ctx.beginPath();
        selection.forEach((pos, idx) => {
            const { x, y } = getCellCenter(pos.row, pos.col);
            if (idx === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        });
        ctx.lineWidth = 8;
        ctx.strokeStyle = 'rgba(255, 214, 79, 0.58)';
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
        ctx.restore();
    }

    function drawParticles() {
        ctx.save();
        particles.forEach(p => {
            ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.fill();
        });
        ctx.restore();
    }

    function drawFlashMessage() {
        if (!flashText) return;
        const alpha = Math.max(0, Math.min(1, (flashUntil - performance.now()) / 700));
        ctx.save();
        ctx.globalAlpha = alpha;

        const isLongNotice = flashText.length > 10;
        if (isLongNotice) {
            drawHudPill(155, 402, 510, 58, 'rgba(255,255,255,0.96)', '#efb9ca');
            ctx.fillStyle = '#c9476d';
            ctx.font = 'bold 19px Malgun Gothic';
            ctx.textAlign = 'center';
            ctx.fillText(flashText, 410, 438);
        } else {
            drawHudPill(676, 560, 218, 42, 'rgba(255,255,255,0.92)', '#f0d093');
            ctx.fillStyle = '#cc5578';
            ctx.font = 'bold 18px Malgun Gothic';
            ctx.textAlign = 'center';
            ctx.fillText(flashText, 785, 587);
        }
        ctx.restore();
    }

    function drawIdleHint() {
        ctx.save();
        ctx.globalAlpha = 0.82;
        ctx.fillStyle = '#9f8e98';
        ctx.font = 'bold 16px Malgun Gothic';
        ctx.textAlign = 'center';
        ctx.fillText('90초 동안 최고 점수에 도전!', 785, 628);
        ctx.restore();
    }

    function getCellFromEvent(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;
        if (x < BOARD_X || y < BOARD_Y) return null;
        const pitch = CELL + GAP;
        const col = Math.floor((x - BOARD_X) / pitch);
        const row = Math.floor((y - BOARD_Y) / pitch);
        if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return null;
        const cellX = BOARD_X + col * pitch;
        const cellY = BOARD_Y + row * pitch;
        if (x < cellX || x > cellX + CELL || y < cellY || y > cellY + CELL) return null;
        return { row, col };
    }

    function getCellCenter(row, col) {
        const x = BOARD_X + col * (CELL + GAP) + CELL / 2;
        const y = BOARD_Y + row * (CELL + GAP) + CELL / 2;
        return { x, y };
    }

    function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }

    function randomStrawberryNumber() {
        const values = [1, 2, 3, 4, 6, 7, 8, 9];
        return values[Math.floor(Math.random() * values.length)];
    }

    function randomBoardValue() {
        if (currentMode === 'median') return randInt(1, 9);
        if (currentMode === 'mode') {
            // 최빈값 게임은 5가 조금 더 자주 보이되 과하게 몰리지 않도록 약 22% 확률로 배치합니다.
            if (Math.random() < 0.22) return 5;
            const others = [1,2,3,4,6,7,8,9];
            return others[Math.floor(Math.random() * others.length)];
        }
        const values = [1,2,3,4,6,7,8,9];
        return values[Math.floor(Math.random() * values.length)];
    }

    function randInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }
})();
</script>
